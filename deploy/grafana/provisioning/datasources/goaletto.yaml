apiVersion: 1
# Remove only Goaletto's previous SQL datasource.
deleteDatasources:
  - name: Goaletto operator
    orgId: $GOALETTO_GRAFANA_ORG_ID
datasources:
  - name: Goaletto VictoriaMetrics
    uid: goaletto-vm
    orgId: $GOALETTO_GRAFANA_ORG_ID
    type: prometheus
    access: proxy
    url: $GOALETTO_VICTORIAMETRICS_URL
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

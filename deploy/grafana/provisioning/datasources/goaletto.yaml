apiVersion: 1
datasources:
  - name: Goaletto operator
    uid: goaletto-operator-pg
    orgId: $GOALETTO_GRAFANA_ORG_ID
    type: grafana-postgresql-datasource
    access: proxy
    url: $GOALETTO_GRAFANA_PG_HOST
    user: $GOALETTO_GRAFANA_PG_USER
    isDefault: false
    editable: false
    jsonData:
      database: goaletto
      sslmode: $GOALETTO_GRAFANA_PG_SSLMODE
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 300
    secureJsonData:
      password: $GOALETTO_GRAFANA_PG_PASSWORD

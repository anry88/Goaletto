# Append these two scrape_configs to existing vmagent.yml; preserve other jobs.
scrape_configs:
  - job_name: goaletto-bot
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: [goaletto-bot-metrics:9109]
        labels:
          app: goaletto
          service: bot
  - job_name: goaletto-worker
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: [goaletto-worker-metrics:9109]
        labels:
          app: goaletto
          service: worker

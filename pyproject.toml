[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "goaletto"
version = "0.1.0"
description = "Football club manager played entirely through a Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{name = "anry88"}]
dependencies = [
  "aiogram>=3.20,<4",
  "SQLAlchemy[asyncio]>=2.0.40,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.9,<3",
  "Pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]
art = ["CairoSVG>=2.7,<3"]

[project.scripts]
goaletto-bot = "goaletto.bot.main:main"
goaletto-worker = "goaletto.worker.main:main"
goaletto-portraits = "goaletto.portraits.cli:main"
goaletto-raster-portraits = "goaletto.portraits.raster_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["goaletto"]
mypy_path = "src"
